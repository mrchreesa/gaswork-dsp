<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">DPS Gasworks Plumbing &amp; Heating</title>
  <desc id="desc">Boilers, heating and plumbing done properly. Gas Safe registered engineer in Bedford.</desc>
  <defs>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EBAE78"/>
      <stop offset=".45" stop-color="#B8672E"/>
      <stop offset="1" stop-color="#7E4520"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDE3E5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#E09A5F" stop-opacity=".2"/>
      <stop offset="1" stop-color="#E09A5F" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0B1117" flood-opacity=".36"/>
    </filter>
  </defs>

