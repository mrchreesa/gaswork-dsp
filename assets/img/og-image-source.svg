  <g font-family="Arial, Helvetica, sans-serif">
    <text x="150" y="83" fill="#F8F9F7" font-size="31" font-weight="700" letter-spacing="-.5">DPS Gasworks</text>
    <text x="151" y="115" fill="#B6C0C8" font-size="19" font-weight="600" letter-spacing="2.1">PLUMBING <tspan fill="#E09A5F">&amp;</tspan> HEATING</text>

    <text x="62" y="224" fill="#F8F9F7" font-size="59" font-weight="800" letter-spacing="-2.6">Boilers, heating</text>
    <text x="62" y="294" fill="#F8F9F7" font-size="59" font-weight="800" letter-spacing="-2.6">and plumbing,</text>
    <text x="62" y="364" fill="#F8F9F7" font-size="59" font-weight="800" letter-spacing="-2.6">done</text>
    <text x="202" y="364" fill="#E09A5F" font-size="59" font-weight="800" letter-spacing="-2.6">properly.</text>

    <g transform="translate(62 467)">
      <rect width="494" height="2" rx="1" fill="url(#copper)"/>
      <text y="44" fill="#DCE1E4" font-size="24" font-weight="600">Gas Safe registered engineer in Bedford</text>
      <g transform="translate(0 75)">
        <rect width="198" height="48" rx="7" fill="#E09A5F"/>
        <text x="99" y="31" text-anchor="middle" fill="#1B2631" font-size="20" font-weight="800">07904 516450</text>
        <text x="220" y="31" fill="#B6C0C8" font-size="19" font-weight="600">Open daily · 6am–10pm</text>
      </g>
    </g>
  </g>

